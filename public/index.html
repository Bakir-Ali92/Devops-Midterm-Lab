<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; max-width: 500px; margin: 40px auto; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        ul { list-style-type: none; padding: 0; }
        li { background: white; margin-bottom: 12px; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .task-text { flex: 1; font-size: 16px; }
        .toggle-btn { background-color: #2ecc71; padding: 8px 12px; font-size: 14px; }
        .toggle-btn:hover { background-color: #27ae60; }
        .action-buttons { display: flex; gap: 5px; }
.delete-btn { background-color: #e74c3c; padding: 8px 12px; font-size: 14px; }
.delete-btn:hover { background-color: #c0392b; }
.task-content { display: flex; align-items: center; flex: 1; }
.task-checkbox { transform: scale(1.3); margin-right: 15px; cursor: pointer; }
.completed-text { color: #95a5a6; text-decoration: line-through; }
    </style>
</head>
<body>
    <h1>Task Manager</h1>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <button onclick="addTask()">Add Task</button>
    </div>
    
    <ul id="taskList"></ul>

    <script>
async function fetchTasks() {
    const res = await fetch('/api/tasks');
    const tasks = await res.json();
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    
    tasks.forEach(task => {
        const isCompleted = task.status === 'Completed';
        const li = document.createElement('li');
        
        li.innerHTML = `
            <div class="task-content">
                <input type="checkbox" class="task-checkbox" onchange="toggleStatus('${task._id}')" ${isCompleted ? 'checked' : ''}>
                <span class="task-text ${isCompleted ? 'completed-text' : ''}">${task.title}</span>
            </div>
            <div class="action-buttons">
                <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
            </div>
        `;
        list.appendChild(li);
    });
}

        async function addTask() {
            const title = document.getElementById('taskInput').value;
            if (!title) return;
            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            document.getElementById('taskInput').value = '';
            fetchTasks();
        }

        async function toggleStatus(id) {
            await fetch(`/api/tasks/${id}`, { method: 'PUT' });
            fetchTasks();
        }

        async function deleteTask(id) {
    await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
    fetchTasks();
}
        fetchTasks();
    </script>
</body>
</html>
