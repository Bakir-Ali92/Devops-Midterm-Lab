<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Task Dashboard</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; }
        
        /* Dashboard Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: var(--dark); margin: 0; }
        .stats { display: flex; gap: 15px; }
        .stat-box { background: white; padding: 10px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold; font-size: 14px; }
        
        /* Form Controls */
        .input-group { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 25px; align-items: center; }
        input[type="text"], input[type="date"], select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box;}
        button { padding: 10px 20px; background-color: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:hover { background-color: #2980b9; }
        
        /* Filters */
        .filters { margin-bottom: 15px; display: flex; gap: 10px; }
        .filter-btn { background: var(--light); color: var(--dark); padding: 8px 15px; border-radius: 20px; font-size: 13px; }
        .filter-btn.active { background: var(--dark); color: white; }

        /* Task List */
        ul { list-style-type: none; padding: 0; }
        li { background: white; margin-bottom: 12px; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;}
        li:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .task-content { display: flex; align-items: center; flex: 1; gap: 15px;}
        .task-checkbox { transform: scale(1.3); cursor: pointer; }
        .task-details { display: flex; flex-direction: column; }
        .task-text { font-size: 16px; font-weight: 500;}
        .completed-text { color: #95a5a6; text-decoration: line-through; }
        
        /* Badges */
        .meta-data { display: flex; gap: 10px; margin-top: 5px; font-size: 12px; }
        .badge { padding: 3px 8px; border-radius: 12px; font-weight: bold; color: white; }
        .priority-High { background-color: var(--danger); }
        .priority-Medium { background-color: #f39c12; }
        .priority-Low { background-color: var(--success); }
        .category-badge { background-color: var(--dark); color: white; padding: 3px 8px; border-radius: 4px; }
        .date-badge { color: #7f8c8d; font-weight: bold; }

        .delete-btn { background-color: var(--danger); }
        .delete-btn:hover { background-color: #c0392b; }
        /* Mobile Responsive Design */
@media (max-width: 768px) {
    .input-group { 
        grid-template-columns: 1fr; 
    }
    .header { 
        flex-direction: column; 
        align-items: flex-start; 
        gap: 15px; 
    }
    .task-content { 
        flex-direction: column; 
        align-items: flex-start; 
        gap: 5px; 
    }
    .meta-data {
        flex-wrap: wrap;
    }
}
    </style>
</head>
<body>
    <div class="header">
        <h1>Pro Task Dashboard</h1>
        <div class="stats">
            <div class="stat-box">Total: <span id="totalTasks">0</span></div>
            <div class="stat-box" style="color: var(--success);">Completed: <span id="completedTasks">0</span></div>
        </div>
    </div>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <select id="taskCategory">
            <option value="University">University</option>
            <option value="Freelance">Freelance</option>
            <option value="Personal">Personal</option>
        </select>
        <select id="taskPriority">
            <option value="Low">Low Priority</option>
            <option value="Medium" selected>Medium Priority</option>
            <option value="High">High Priority</option>
        </select>
        <input type="date" id="taskDate">
        <button onclick="addTask()">Add Task</button>
    </div>
    
    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('All', this)">All Tasks</button>
        <button class="filter-btn" onclick="setFilter('Pending', this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('Completed', this)">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <script>
        let currentFilter = 'All';

        async function fetchTasks() {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            renderTasks(tasks);
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            let completedCount = 0;

            const filteredTasks = tasks.filter(task => {
                const isCompleted = task.status === 'Completed';
                if (isCompleted) completedCount++;
                
                if (currentFilter === 'Pending') return !isCompleted;
                if (currentFilter === 'Completed') return isCompleted;
                return true;
            });

            // Update Dashboard Stats
            document.getElementById('totalTasks').innerText = tasks.length;
            document.getElementById('completedTasks').innerText = completedCount;

            if (filteredTasks.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; color: #7f8c8d; padding: 40px; background: white; border-radius: 8px;">
                        <h3>No tasks found</h3>
                        <p>You're all caught up! ☕</p>
                    </div>`;
                return;
            }

            filteredTasks.forEach(task => {
                const isCompleted = task.status === 'Completed';
                const priority = task.priority || 'Medium';
                const category = task.category || 'General';
                const dueDate = task.dueDate ? new Date(task.dueDate).toLocaleDateString() : 'No date';

                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="task-content">
                        <input type="checkbox" class="task-checkbox" onchange="toggleStatus('${task._id}')" ${isCompleted ? 'checked' : ''}>
                        <div class="task-details">
                            <span class="task-text ${isCompleted ? 'completed-text' : ''}">${task.title}</span>
                            <div class="meta-data">
                                <span class="badge priority-${priority}">${priority}</span>
                                <span class="category-badge">${category}</span>
                                <span class="date-badge">📅 ${dueDate}</span>
                            </div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        async function addTask() {
            const title = document.getElementById('taskInput').value;
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const dueDate = document.getElementById('taskDate').value;

            if (!title) return;

            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, priority, dueDate })
            });

            document.getElementById('taskInput').value = '';
            document.getElementById('taskDate').value = '';
            fetchTasks();
        }

        async function toggleStatus(id) {
            await fetch(`/api/tasks/${id}`, { method: 'PUT' });
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
            fetchTasks();
        }

        function setFilter(filterType, btnElement) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            fetchTasks(); 
        }

        fetchTasks();
    </script>
</body>
</html>
